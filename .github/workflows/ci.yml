name: Workshop smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  nix:
    name: Pinned flake tools and optional Torch target (Linux CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
      - run: nix run .#check -- --torch
      - name: Check published optional-target provenance
        run: nix develop .#ci --command uv run --frozen python scripts/check_materials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-nix-torch
          path: results/live/
  math:
    name: Generated equations and Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - run: uv run --frozen python scripts/export_lean.py
      - run: git diff --exit-code -- formal/Generated.lean formal/solve_program.json formal/provenance.json
      - name: Install pinned Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and recheck proof terms
        run: |
          mkdir -p "$HOME/scratch/rumoca-workshop/formal-lake"
          ln -s "$HOME/scratch/rumoca-workshop/formal-lake" formal/.lake
          cd formal
          lake update
          lake exe cache get Generated.lean Workshop.lean
          lake build
          lake env leanchecker Generated Workshop
      - name: Audit theorem assumptions and reject admissions
        run: |
          set -o pipefail
          cd formal
          lake env lean Workshop.lean | tee ../verification/lean-ci.txt
          if rg 'sorryAx' ../verification/lean-ci.txt; then exit 1; fi
          if rg '^\s*(axiom|opaque).*|\b(sorry|admit|native_decide)\b' Generated.lean Workshop.lean; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-verification
          path: verification/lean-ci.txt
  container:
    name: Devcontainer configuration, features and startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run .#container-build -- --tag rumoca-workshop:ci
      - name: Start the configured devcontainer and run its lifecycle commands
        run: nix develop .#ci --command devcontainer up --workspace-folder .
      - name: Check configured user, SSH feature and numerical audit
        run: |
          nix develop .#ci --command devcontainer exec --workspace-folder . bash -c 'test "$(id -un)" = vscode && command -v sshd && uv run --frozen python scripts/math_audit.py --output results/live'
      - name: Rehearse agent terminal startup without accounts
        run: nix develop .#ci --command devcontainer exec --workspace-folder . uv run --frozen python scripts/check_agent_terminals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-devcontainer-${{ matrix.os }}
          path: results/live/
  workshop:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/smoke_test.py
      - if: matrix.os == 'ubuntu-latest'
        run: uv run --frozen python scripts/math_audit.py --output results/live
      - name: Check workshop artifacts and provenance
        run: uv run --frozen python scripts/check_materials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/live/
