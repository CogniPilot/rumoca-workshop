name: Workshop smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  container:
    name: Devcontainer build and fresh startup commands
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f .devcontainer/Dockerfile -t rumoca-workshop:ci .
      - run: |
          docker run --rm --user vscode -v "$PWD:/workspaces/rumoca-workshop" -w /workspaces/rumoca-workshop rumoca-workshop:ci bash -c 'uv sync --frozen && uv run --frozen python scripts/smoke_test.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-devcontainer
          path: results/live/
  workshop:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/live/
