[project]
name = "rumoca-workshop"
version = "1.0.0"
description = "Hands-on Modelica to JAX identification and CasADi optimization"
requires-python = "==3.12.*"
dependencies = [
  "rumoca==0.10.2",
  "jax==0.4.38",
  "casadi==3.7.2",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.3",
]

[dependency-groups]
slides = ["python-pptx==1.0.2", "reportlab==4.4.4", "qrcode==8.2"]
torch = ["torch==2.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# Rumoca release wheels are distributed on GitHub, not assumed from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
rumoca = [
  { url = "https://github.com/CogniPilot/rumoca/releases/download/v0.10.2/rumoca-0.10.2-cp310-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/CogniPilot/rumoca/releases/download/v0.10.2/rumoca-0.10.2-cp310-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://github.com/CogniPilot/rumoca_workshop_amc2026/releases/download/workshop-wheels-2026/rumoca-0.10.2-cp310-abi3-macosx_14_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/CogniPilot/rumoca_workshop_amc2026/releases/download/workshop-wheels-2026/rumoca-0.10.2-cp310-abi3-macosx_14_0_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
  { url = "https://github.com/CogniPilot/rumoca/releases/download/v0.10.2/rumoca-0.10.2-cp310-abi3-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
