version = 1
ir = "solve"
name = "workshop-proof-export"
description = "Render scoped Lean types and RHS directly from checked scalar Solve operations"

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
events = false
runtime_events = false
dynamic_ranges = false
dynamic_control_flow = false

[[files]]
path = "solve_program.json"
template = "program.json.jinja"

[[files]]
path = "Generated.lean"
template = "rhs.lean.jinja"
